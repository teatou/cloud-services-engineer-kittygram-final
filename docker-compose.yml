services:
  db:
    image: postgres:16.11
    container_name: postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kittygram_backend
    container_name: backend
    env_file:
      - .env
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kittygram_frontend
    container_name: frontend
    volumes:
      - static_volume:/app/build

  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: kittygram_gateway
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - static_volume:/static/
      - media_volume:/media/
    depends_on:
      - backend
      - frontend

volumes:
  static_volume:
  media_volume:
  pg_data:
