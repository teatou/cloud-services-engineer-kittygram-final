version: '3.8'

services:
  db:
    image: postgres:16.11
    container_name: postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: teatou/kittygram_backend:latest
    container_name: backend
    env_file:
      - .env
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: teatou/kittygram_frontend:latest
    container_name: frontend
    volumes:
      - static_volume:/app/build
    restart: unless-stopped

  gateway:
    image: teatou/kittygram_gateway:latest
    container_name: gateway
    ports:
      - "9000:80"
    volumes:
      - static_volume:/static/
      - media_volume:/media/
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  pg_data:
